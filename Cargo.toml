[workspace]
resolver = "2"
members = [
    "crates/vi-core",
    "crates/vi-asr",
    "crates/vi-rewrite",
    "crates/vi-audio",
    "crates/vi-win32",
    "crates/vi-app",
]

[workspace.package]
version = "0.5.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.11"
libloading = "0.8"
sha2 = "0.10"
hex = "0.4"
zeroize = { version = "1.8", features = ["derive"] }
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }
regex = "1.11"
once_cell = "1.20"
parking_lot = "0.12"
crossbeam-channel = "0.5"
hound = "3.5"
dirs = "5.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
