name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site:
    name: Website checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/check-site.mjs
      - name: Excerpts are up to date
        run: |
          python3 scripts/gen-excerpts.py
          git diff --exit-code website/excerpts.js

  rust:
    name: Rust tests
    # The release-candidate branch is built, not tested, at the owner's request; the owner tests on Windows.
    if: github.ref != 'refs/heads/feat/hex-informed-2.1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux audio headers
        run: |
          sudo -S -p '' apt-get update
          sudo -S -p '' apt-get install -y libasound2-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  windows:
    name: Windows build & tests
    if: github.ref != 'refs/heads/feat/hex-informed-2.1'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo build --release

  # Builds the MSVC exe (manifest and icon embedded by crates/vi-app/build.rs) and swaps it into the published
  # v2.0.0-beta.1 portable zip, so a candidate can be tried on Windows without the model and runtime assets.
  # The NSIS installer is not built here: its plugin needs an i686 clang toolchain that windows-latest lacks.
  windows-release-candidate:
    name: Windows release candidate (portable zip)
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/feat/hex-informed-2.1'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p vi-app
      - name: Assemble portable zip from the published beta
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v2.0.0-beta.1 -p '*portable.zip' -D base
          $zip = Get-ChildItem base -Filter *portable.zip | Select-Object -First 1
          if (-not $zip) { throw 'published portable zip not found' }
          Expand-Archive -Path $zip.FullName -DestinationPath stage
          $old = Get-ChildItem stage -Recurse -Filter keyreed.exe | Select-Object -First 1
          if (-not $old) { throw 'keyreed.exe not found in the published zip' }
          Copy-Item target\release\keyreed.exe $old.FullName -Force
          New-Item -ItemType Directory -Force out | Out-Null
          $name = "keyreed-$($env:GITHUB_SHA.Substring(0, 8))-portable-candidate.zip"
          Compress-Archive -Path stage\* -DestinationPath "out\$name"
          $hash = (Get-FileHash "out\$name" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name" | Set-Content -Encoding ascii out\SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: keyreed-windows-candidate
          path: out/*
